name: cda_jepa

# Tests cda_jepa (the JEPA encoder for gym-continuousDoubleAuction) against an
# installed gym-CDA.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      gym_cda_ref:
        description: gym-continuousDoubleAuction branch, tag or commit to test against
        required: false

env:
  # A gym-CDA ref at version 2.2.0 or later (pyproject pins >=2.2,<3).
  GYM_CDA_REF: ${{ inputs.gym_cda_ref || 'master' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # The I-JEPA and LeJEPA code, shipped unchanged as `src` and `lejepa`.
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install gym-CDA (CPU torch) and cda_jepa
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 --extra-index-url https://download.pytorch.org/whl/cpu
          pip install "gym_continuousDoubleAuction @ git+https://github.com/ChuaCheowHuan/gym-continuousDoubleAuction@${GYM_CDA_REF}"
          pip install ".[test]"

      - name: Tests, including real training iterations
        run: python -m pytest -q
