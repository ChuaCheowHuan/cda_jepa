[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cda-jepa"
version = "0.1.0"
description = "JEPA for gym-continuousDoubleAuction, as an installable training extension."
readme = "README.md"
requires-python = ">=3.12"
# MIT for this package; the forks it installs are CC BY-NC 4.0 (NOTICE).
license-files = ["LICENSE", "NOTICE", "third_party/ijepa/LICENSE", "third_party/lejepa/LICENSE"]
# gym-CDA is not on PyPI: install it first (see README). 2.2 is the first with the
# `gym_cda.encoders` entry point. ijepa is a git submodule shipped unchanged (see
# [tool.setuptools]); only torch and numpy are needed at runtime. LeJEPA is not
# in the default wheel: nothing imports it yet (SIGReg is planned), so it is an
# optional extra that installs the pinned fork and the scipy it imports.
dependencies = ["gym_continuousDoubleAuction>=2.2,<3", "torch", "numpy"]

[project.optional-dependencies]
# The LeJEPA fork at the commit pinned by .gitmodules, plus its undeclared scipy.
lejepa = [
    "scipy",
    "lejepa @ git+https://github.com/ChuaCheowHuan/lejepa@8f1a7bced2fdbc14c4a309b4d8cfbdf190aaa617",
]
test = ["pytest", "ruff"]

[project.entry-points."gym_cda.extensions"]
jepa = "cda_jepa:EXTENSION"

[project.entry-points."gym_cda.encoders"]
jepa = "cda_jepa.encoder"

# `src` is I-JEPA's code: the ChuaCheowHuan fork, pinned as a git submodule and
# shipped unchanged as a top-level package. I-JEPA has no packaging and imports
# itself as `src.*`, which is why it keeps that name. Its `datasets` subpackage is
# left out; its top-level scripts (train.py, transforms.py) ship unchanged but are
# never imported, since they need torchvision and yaml. LeJEPA is not listed here:
# `cda-jepa[lejepa]` installs its pinned fork as a separate distribution (#19).
[tool.setuptools]
packages = [
    "cda_jepa",
    "cda_jepa.pretrain",
    "src",
    "src.masks",
    "src.models",
    "src.utils",
]

[tool.setuptools.package-dir]
src = "third_party/ijepa/src"

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# The authors' code, shipped unchanged (tests/test_packaging.py); never reformat it.
extend-exclude = ["third_party"]

[tool.ruff.lint]
# Pinned, so a newer ruff's default rule set does not change what CI enforces.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "preserve"
